[package]
name = "ouro-terminal-picker"
version = "0.1.0"
description = "In-terminal Zellij session picker and terminal configuration helper for Kitty and Rio/Ourio"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
name = "ouro_terminal_picker"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
toml_edit = "0.25"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"

[lints.cargo]
unused_dependencies = "deny"
