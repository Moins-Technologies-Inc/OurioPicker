[package]
name = "ouro-terminal-picker"
version = "0.1.1"
description = "In-terminal Zellij session picker and terminal configuration helper for Kitty and Rio/Ourio"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
name = "ouro_terminal_picker"
path = "src/lib.rs"

[[bin]]
name = "ouro-terminal-picker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = { version = "4", default-features = false }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
thiserror = "2"
toml_edit = "0.25"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"

[lints.cargo]
unused_dependencies = "deny"
